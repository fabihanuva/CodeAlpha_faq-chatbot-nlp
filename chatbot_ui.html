<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopBot — FAQ Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<style>
/* ── Theme tokens ── */
:root {
  --bg:         #F7F6F3;
  --surface:    #FFFFFF;
  --surface2:   #F3F2EF;
  --border:     #E4E2DB;
  --text:       #1A1A18;
  --muted:      #6B6960;
  --accent:     #2D6BE4;
  --accent-lt:  #EBF0FD;
  --user-bg:    #2D6BE4;
  --user-text:  #FFFFFF;
  --bot-bg:     #FFFFFF;
  --tag-bg:     #EEF3FF;
  --tag-text:   #2D6BE4;
  --highlight:  #FFF0C2;
  --hl-border:  #F5C842;
  --shadow:     0 2px 8px rgba(0,0,0,0.07), 0 8px 32px rgba(0,0,0,0.06);
  --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition: 0.22s ease;
}

[data-theme="dark"] {
  --bg:         #111110;
  --surface:    #1C1C1A;
  --surface2:   #252522;
  --border:     #2E2E2B;
  --text:       #EEECEA;
  --muted:      #888680;
  --accent:     #5B8EF0;
  --accent-lt:  #1A2340;
  --user-bg:    #3B6EE8;
  --user-text:  #FFFFFF;
  --bot-bg:     #1C1C1A;
  --tag-bg:     #1A2340;
  --tag-text:   #7AAAF5;
  --highlight:  #3D3010;
  --hl-border:  #886A00;
  --shadow:     0 2px 8px rgba(0,0,0,0.3), 0 8px 32px rgba(0,0,0,0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  transition: background var(--transition), color var(--transition);
}

/* ── Chat window ── */
.chat-window {
  width: 100%;
  max-width: 480px;
  height: min(720px, calc(100dvh - 32px));
  background: var(--surface);
  border-radius: 24px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
}

/* ── Header ── */
.chat-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  transition: border-color var(--transition);
}

.bot-avatar {
  width: 38px; height: 38px;
  border-radius: 11px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}

.header-info { flex: 1; min-width: 0; }

.header-name {
  font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
  color: var(--text);
}

.header-status {
  font-size: 11px; color: var(--muted);
  margin-top: 1px; display: flex; align-items: center; gap: 4px;
}

.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #30C45E; flex-shrink: 0;
}

/* ── Dark mode toggle ── */
.theme-btn {
  width: 34px; height: 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  transition: background var(--transition), border-color var(--transition), transform 0.1s;
}
.theme-btn:hover { background: var(--accent-lt); transform: scale(1.08); }
.theme-btn:active { transform: scale(0.95); }

/* ── Starter cards (welcome screen) ── */
.starter-screen {
  padding: 14px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  transition: border-color var(--transition);
}

.starter-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 0 2px;
}

.starter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}

.starter-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 10px 12px;
  cursor: pointer;
  text-align: left;
  font-family: var(--font);
  transition: background 0.15s, border-color 0.15s, transform 0.12s;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.starter-card:hover {
  background: var(--accent-lt);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.starter-card:active { transform: translateY(0); }

.starter-icon { font-size: 18px; line-height: 1; }

.starter-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}

.starter-sub {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.3;
}

/* Hide starter screen once chat begins */
.starter-screen.hidden {
  display: none;
}

/* ── Messages ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ── Message rows ── */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  animation: fadeUp 0.22s cubic-bezier(0.22,1,0.36,1);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0)   scale(1); }
}

.msg-row.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 26px; height: 26px;
  border-radius: 8px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; align-self: flex-end;
}

.msg-avatar.user-av { background: var(--surface2); }

/* ── Bubble ── */
.bubble-wrap { display: flex; flex-direction: column; max-width: 80%; }
.msg-row.user .bubble-wrap { align-items: flex-end; }

.bubble {
  padding: 10px 13px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.55;
  word-break: break-word;
}

.bubble.bot {
  background: var(--bot-bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  transition: background var(--transition), border-color var(--transition);
}

.bubble.user {
  background: var(--user-bg);
  color: var(--user-text);
  border-bottom-right-radius: 4px;
}

.bubble.fallback {
  border-color: var(--hl-border);
  background: var(--highlight);
}

/* ── Keyword highlight spans ── */
.kw-highlight {
  background: var(--highlight);
  border-bottom: 1.5px solid var(--hl-border);
  border-radius: 3px;
  padding: 0 2px;
  font-weight: 500;
  transition: background var(--transition);
}

/* ── Meta row (category tag) ── */
.msg-meta {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px; flex-wrap: wrap;
}

.cat-tag {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--tag-text); background: var(--tag-bg);
  padding: 2px 7px; border-radius: 4px;
  transition: background var(--transition), color var(--transition);
}

/* ── Follow-up suggestion chips ── */
.followup-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
}

.followup-chip {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: 14px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  font-family: var(--font);
  transition: background 0.14s, color 0.14s, transform 0.1s;
  line-height: 1.3;
  text-align: left;
}

.followup-chip:hover {
  background: var(--accent);
  color: #fff;
  transform: translateY(-1px);
}

.followup-chip:active { transform: translateY(0); }

/* ── Typing indicator ── */
.typing-indicator {
  display: flex; align-items: center; gap: 4px;
  padding: 11px 13px;
  background: var(--bot-bg);
  border: 1px solid var(--border);
  border-radius: 17px;
  border-bottom-left-radius: 4px;
  width: fit-content;
  transition: background var(--transition), border-color var(--transition);
}

.typing-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  animation: tdot 1.2s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.18s; }
.typing-dot:nth-child(3) { animation-delay: 0.36s; }

@keyframes tdot {
  0%,60%,100% { transform: translateY(0); opacity: 0.5; }
  30%          { transform: translateY(-5px); opacity: 1; }
}

/* ── Input bar ── */
.chat-input-area {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 7px;
  flex-shrink: 0;
  background: var(--surface);
  transition: background var(--transition), border-color var(--transition);
}

.chat-input {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 9px 14px;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text);
  background: var(--surface2);
  outline: none; resize: none;
  transition: border-color 0.15s, background var(--transition), color var(--transition);
  line-height: 1.4; max-height: 96px; overflow-y: auto;
}

.chat-input:focus {
  border-color: var(--accent);
  background: var(--surface);
}

.chat-input::placeholder { color: var(--muted); }

.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--accent);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, transform 0.1s;
}

.send-btn:hover { background: #1d57c7; transform: scale(1.06); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }
.send-btn svg { width: 16px; height: 16px; fill: #fff; }

/* ── Responsive ── */
@media (max-width: 520px) {
  body { padding: 0; }
  .chat-window { border-radius: 0; height: 100dvh; max-width: 100%; }
}
</style>
</head>
<body>

<div class="chat-window">

  <!-- Header -->
  <div class="chat-header">
    <div class="bot-avatar">🛍️</div>
    <div class="header-info">
      <div class="header-name">ShopBot</div>
      <div class="header-status">
        <span class="status-dot"></span>
        Online · FAQ Assistant
      </div>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
  </div>

  <!-- Starter cards -->
  <div class="starter-screen" id="starter-screen">
    <div class="starter-label">How can I help you today?</div>
    <div class="starter-grid">
      <button class="starter-card" onclick="sendQuick('How do I track my order?')">
        <span class="starter-icon">📦</span>
        <span class="starter-title">Track my order</span>
        <span class="starter-sub">Shipping & delivery status</span>
      </button>
      <button class="starter-card" onclick="sendQuick('How do I return an item?')">
        <span class="starter-icon">↩️</span>
        <span class="starter-title">Return an item</span>
        <span class="starter-sub">Refunds & exchanges</span>
      </button>
      <button class="starter-card" onclick="sendQuick('My payment was declined')">
        <span class="starter-icon">💳</span>
        <span class="starter-title">Payment issue</span>
        <span class="starter-sub">Billing & card problems</span>
      </button>
      <button class="starter-card" onclick="sendQuick('I forgot my password')">
        <span class="starter-icon">🔑</span>
        <span class="starter-title">Account help</span>
        <span class="starter-sub">Login, password, profile</span>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages">
    <div class="msg-row bot">
      <div class="msg-avatar">🛍️</div>
      <div class="bubble-wrap">
        <div class="bubble bot">
          Hi there! 👋 I'm <strong>ShopBot</strong>, your FAQ assistant. Pick a topic above or type your question below — I'm here to help!
        </div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      id="chat-input"
      class="chat-input"
      placeholder="Ask a question…"
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="send-btn" onclick="handleSend()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/></svg>
    </button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  API CONFIGURATION
// ═══════════════════════════════════════════
const API_URL = "http://localhost:8000";

// ═══════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════
const messagesEl   = document.getElementById("chat-messages");
const inputEl      = document.getElementById("chat-input");
const sendBtn      = document.getElementById("send-btn");
const starterEl    = document.getElementById("starter-screen");
const themeBtnEl   = document.getElementById("theme-btn");
let chatStarted    = false;

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 96) + "px";
}

function escapeHTML(str) {
  if (!str) return "";
  return str
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function hideStarterScreen() {
  if (!chatStarted) {
    chatStarted = true;
    starterEl.classList.add("hidden");
  }
}

// ═══════════════════════════════════════════
//  SEND LOGIC (Integrated with API)
// ═══════════════════════════════════════════

async function handleSend() {
  const text = inputEl.value.trim();
  if (!text) return;

  hideStarterScreen();

  appendUserMessage(text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;

  showTyping();

  try {
    const response = await fetch(`${API_URL}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text })
    });

    if (!response.ok) throw new Error('API Error');

    const result = await response.json();
    
    removeTyping();
    appendBotMessage(result);
  } catch (error) {
    console.error("Error:", error);
    removeTyping();
    appendBotMessage({
      answer: "I'm having trouble connecting to my brain right now. Please make sure the backend is running!",
      matched: false
    });
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function sendQuick(text) {
  inputEl.value = text;
  handleSend();
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
}

function appendUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `
    <div class="bubble-wrap">
      <div class="bubble user">${escapeHTML(text)}</div>
    </div>
    <div class="msg-avatar user-av">👤</div>
  `;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.id = "typing-row";
  row.innerHTML = `
    <div class="msg-avatar">🛍️</div>
    <div class="bubble-wrap">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
  `;
  messagesEl.appendChild(row);
  scrollToBottom();
}

function removeTyping() {
  const el = document.getElementById("typing-row");
  if (el) el.remove();
}

function appendBotMessage(result) {
  const row = document.createElement("div");
  row.className = "msg-row bot";

  const metaHTML = result.matched && result.category
    ? `<div class="msg-meta"><span class="cat-tag">${escapeHTML(result.category)}</span></div>`
    : "";

  row.innerHTML = `
    <div class="msg-avatar">🛍️</div>
    <div class="bubble-wrap">
      ${metaHTML}
      <div class="bubble bot ${result.matched ? "" : "fallback"}">${escapeHTML(result.answer)}</div>
    </div>
  `;
  messagesEl.appendChild(row);
  scrollToBottom();
}

// ═══════════════════════════════════════════
//  DARK MODE
// ═══════════════════════════════════════════
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute("data-theme") === "dark";
  html.setAttribute("data-theme", isDark ? "light" : "dark");
  themeBtnEl.textContent = isDark ? "🌙" : "☀️";
}

// Initialize
window.onload = () => {
    console.log("ShopBot UI Initialized");
};
</script>
</body>
</html>
